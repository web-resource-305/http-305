<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP 305</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#153a59">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HTTP 305">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        .options {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .toggle:hover {
            color: var(--text);
        }

        /* Custom toggle switch */
        .toggle input {
            display: none;
        }

        .toggle .switch {
            position: relative;
            width: 38px;
            height: 22px;
            background: var(--border);
            border-radius: 11px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle .switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background: var(--text-muted);
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }

        .toggle input:checked+.switch {
            background: var(--accent);
        }

        .toggle input:checked+.switch::after {
            transform: translateX(16px);
            background: #fff;
        }

        #install-btn {
            display: none;
            margin: 10px auto 0;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: transparent;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        #install-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        /* Keyboard shortcut hint */
        .kbd {
            display: inline-block;
            padding: 2px 6px;
            font-size: 11px;
            font-family: inherit;
            color: var(--text-muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            margin-left: 4px;
        }

        @media (max-width: 480px) {
            .options {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <h1>HTTP <span>305</span></h1>
            <p>Web proxy</p>
        </div>

        <form id="proxyForm" action="/pxy/" method="GET" target="_blank" onsubmit="return handleSubmit(this)">
            <div class="input-group">
                <input type="text" name="url" id="urlInput" placeholder="Paste a URL..." autocomplete="off" autofocus>
            </div>

            <div class="options">
                <label class="toggle">
                    <input type="checkbox" id="disable-js" name="js" value="0" checked>
                    <span class="switch"></span>
                    Disable JS
                </label>
                <label class="toggle">
                    <input type="checkbox" id="uk-redirect" name="ukred" value="1">
                    <span class="switch"></span>
                    UK Redirect
                </label>
            </div>

            <button type="submit" class="btn btn-block">Render</button>
        </form>

        <div class="footer">
            <p>Paste any URL to browse through the proxy</p>
            <button id="install-btn">Add to Home Screen</button>
        </div>
    </div>

    <script>
        function handleSubmit(form) {
            var url = document.getElementById('urlInput').value.trim();
            if (!url) return false;

            var jsDisabled = document.getElementById('disable-js').checked;
            var jsParam = jsDisabled ? '?js=0' : '';

            window.open('/pxy/' + encodeURIComponent(url) + jsParam, '_blank');
            clearInput();
            return false;
        }

        function clearInput() {
            setTimeout(function () {
                document.getElementById('urlInput').value = '';
            }, 3000);
        }

        document.getElementById('urlInput').addEventListener('focus', async function () {
            if (this.value !== '') return;
            try {
                const text = await navigator.clipboard.readText();
                const match = text.match(/https?:\/\/[^\s"'<>]+/);
                if (match) this.value = match[0];
            } catch (_) {
                // clipboard permission denied or unavailable
            }
        });

        // Add to Home Screen / PWA install prompt
        var deferredPrompt = null;
        var installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        installBtn.addEventListener('click', async function () {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            var result = await deferredPrompt.userChoice;
            if (result.outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', function () {
            installBtn.style.display = 'none';
            deferredPrompt = null;
        });

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function () { });
        }
    </script>
</body>

</html>
